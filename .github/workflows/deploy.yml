name: FTP ile hosting.com.tr'ye Deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ftp-deploy:
    name: Dosyaları FTPS ile sunucuya gönder
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ftp.derspros.com.tr
      # Giriş sonrası ev dizinine (/home/derspros) göreli hedef klasör
      REMOTE_DIR: ays.derspros.com.tr
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: lftp kur
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # SamKirkland/FTP-Deploy-Action yerine lftp kullanılıyor: o action Node 20
      # için yazılmış ama runner Node 24'e zorluyor ve Node 24'ün katı TLS
      # varsayılanları sunucunun FTPS yapılandırmasıyla el sıkışamayıp
      # "Timeout (control socket)" ile asılı kalıyordu. lftp sistemin TLS
      # kitaplığını kullandığı için bu uyumsuzluktan etkilenmiyor.
      - name: FTPS ile yükle
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_HOST:21" <<'LFTP'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          # Sunucu ara sıra bağlantıyı hiç yanıtlamıyor (banner bile
          # gelmeden zaman aşımı). Eski ayar ~100 saniye sonra pes ediyor
          # ve deploy geçici bir kesinti yüzünden başarısız oluyordu; bu
          # bir kez yaşandı ve kod tamamen doğruyken canlıya çıkamadı.
          # Denemeler arası artan bekleme ile toplam ~5 dakikaya çıkarıldı:
          # kısa kesintileri atlatır, gerçek arızada yine de sonlanır.
          set net:timeout 30
          set net:max-retries 5
          set net:reconnect-interval-base 8
          set net:reconnect-interval-multiplier 1.5
          set cmd:fail-exit true
          debug 3
          pwd
          mirror --reverse --verbose --no-perms --exclude '^\.git' --exclude-glob 'config.php' --exclude-glob 'README.md' ./ ays.derspros.com.tr/
          bye
          LFTP
