name: FTP ile hosting.com.tr'ye Deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ftp-deploy:
    name: Dosyaları FTP ile sunucuya gönder
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: FTP ile ays.derspros.com.tr dizinine yükle
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.derspros.com.tr
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          server-dir: ays.derspros.com.tr/
          # Sunucu cleartext FTP'yi reddediyor (421 "Please reconnect using TLS
          # security mechanisms"), bu yüzden port 21 üzerinden explicit FTPS.
          protocol: ftps
          # Sertifika ftp.derspros.com.tr yerine sunucu adına (talom.wlsrv.com)
          # düzenlendiğinden strict doğrulama hostname uyuşmazlığında patlar.
          security: loose
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            config.php
            README.md
            .gitignore
